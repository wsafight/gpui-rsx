[package]
name = "gpui-rsx"
version = "0.2.0"
edition = "2024"
description = "A JSX-like macro for GPUI - simplify UI development with HTML-like syntax"
authors = ["GPUI-RSX Contributors"]
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"
homepage = "https://github.com/wsafight/gpui-rsx"
documentation = "https://docs.rs/gpui-rsx"
readme = "README.md"
keywords = ["gpui", "rsx", "jsx", "macro", "ui"]
categories = ["gui", "development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-error = "1.0"

[dev-dependencies]
# 用于测试
trybuild = "1.0"

# Documentation configuration for docs.rs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Optimized release profile
[profile.release]
lto = true
codegen-units = 1
