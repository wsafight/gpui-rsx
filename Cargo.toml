[workspace]
members = [".", "crates/gpui-rsx-core", "crates/gpui-stub", "crates/gpui-stub-macros", "xtask", "crates/gpui-rsx-tools", "crates/cargo-rsx", "crates/gpui-rsx-wasm"]
exclude = ["demo", "fuzz", "editors/zed"]
resolver = "3"

[package]
name = "gpui-rsx"
version = "0.8.2"
edition = "2024"
rust-version = "1.88"
description = "A JSX-like macro for GPUI - simplify UI development with HTML-like syntax"
authors = ["GPUI-RSX Contributors"]
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"
homepage = "https://github.com/wsafight/gpui-rsx"
documentation = "https://docs.rs/gpui-rsx"
readme = "README.md"
keywords = ["gpui", "rsx", "jsx", "macro", "ui"]
categories = ["gui", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**",
    "/benches/class_performance.rs",
    "/benches/support/**",
]

[lib]
proc-macro = true

[dependencies]
gpui-rsx-core = { version = "0.8.2", path = "crates/gpui-rsx-core" }
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }

[features]
default = []
# Numeric spacing/sizing classes use Tailwind's 4px scale (`gap-4` → 16px) in `rsx!`.
tailwind-scale = []
# Debug builds print ignored dynamic classes once, at process exit, instead of as they occur.
dynamic-class-report = []

[dev-dependencies]
# Doctests compile against a GPUI stand-in so documentation examples are verified.
gpui = { package = "gpui-rsx-gpui-stub", path = "crates/gpui-stub" }
criterion = { version = "0.8.2", features = ["html_reports"] }
trybuild = "1.0.116"

[[bench]]
name = "class_performance"
harness = false

# Documentation configuration for docs.rs
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
