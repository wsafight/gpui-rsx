[package]
name = "gpui-rsx"
version = "0.1.2"
edition = "2024"
description = "A JSX-like macro for GPUI - simplify UI development with HTML-like syntax"
authors = ["GPUI-RSX Contributors"]
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"
keywords = ["gpui", "rsx", "jsx", "macro", "ui"]
categories = ["gui", "development-tools"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"

[dev-dependencies]
# 用于测试
trybuild = "1.0"

# Examples 依赖 GPUI，标记为可选
# 如果要运行 examples，需要先安装 gpui
[[example]]
name = "counter"
required-features = []

[[example]]
name = "todo_app"
required-features = []
