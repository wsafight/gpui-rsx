[package]
name = "gpui-rsx-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Parser and code generator behind gpui-rsx, usable from tools (CLI, LSP, playground)"
authors = ["GPUI-RSX Contributors"]
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"
homepage = "https://github.com/wsafight/gpui-rsx"
documentation = "https://docs.rs/gpui-rsx-core"
readme = "README.md"
keywords = ["gpui", "rsx", "jsx", "parser", "codegen"]
categories = ["gui", "development-tools"]

[dependencies]
syn = { version = "2.0.117", features = ["full"] }
quote = "1.0.45"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
insta = "1"
prettyplease = "0.3"

[[bench]]
name = "expansion"
harness = false
