[package]
name = "gpui-rsx-tools"
version = "0.8.2"
edition = "2024"
rust-version = "1.98"
description = "Shared diagnostics, formatting, migration and preview for GPUI-RSX tools"
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"

[dependencies]
gpui-rsx-core = { version = "0.8.2", path = "../gpui-rsx-core" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
prettyplease = "0.2"

swc_common = "26.0.0"
swc_ecma_ast = "29.0.2"
swc_ecma_parser = { version = "46.1.2", default-features = false, features = ["typescript"] }
swc_ecma_visit = "29.0.0"
