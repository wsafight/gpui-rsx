[package]
name = "gpui-rsx-tools"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
description = "Shared diagnostics, formatting, migration and preview for GPUI-RSX tools"
license.workspace = true
repository.workspace = true

[features]
# Linting, formatting, preview and LSP integrations do not require SWC.
default = []
convert = [
    "dep:swc_common",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_parser",
    "dep:swc_ecma_visit",
]

[dependencies]
gpui-rsx-core.workspace = true
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
prettyplease = "0.2"

swc_common = { version = "27.0.0", optional = true }
swc_ecma_ast = { version = "30.0.0", optional = true }
swc_ecma_parser = { version = "47.0.0", default-features = false, features = ["typescript"], optional = true }
swc_ecma_visit = { version = "30.0.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "analysis"
harness = false
