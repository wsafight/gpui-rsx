[package]
name = "gpui-rsx-tools"
version = "0.9.0"
edition = "2024"
rust-version = "1.98"
description = "Shared diagnostics, formatting, migration and preview for GPUI-RSX tools"
license = "MIT"
repository = "https://github.com/wsafight/gpui-rsx"

[features]
# Linting, formatting, preview and LSP integrations do not require SWC.
default = []
convert = [
    "dep:swc_common",
    "dep:swc_ecma_ast",
    "dep:swc_ecma_parser",
    "dep:swc_ecma_visit",
]

[dependencies]
gpui-rsx-core = { version = "0.9.0", path = "../gpui-rsx-core" }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "1"
prettyplease = "0.3"

swc_common = { version = "26.0.0", optional = true }
swc_ecma_ast = { version = "29.0.2", optional = true }
swc_ecma_parser = { version = "46.1.2", default-features = false, features = ["typescript"], optional = true }
swc_ecma_visit = { version = "29.0.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "analysis"
harness = false
