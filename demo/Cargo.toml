[package]
name = "gpui-rsx-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Keep `gpui::` available to RSX expansions and GPUI derives. Kit re-exports
# its matching GPUI snapshot, component catalog, platform entry point and assets.
gpui = { package = "gpui-kit", version = "=0.9.0" }
gpui-rsx = { path = ".." }
serde_json = { version = "1", optional = true }

[features]
native-profiler = ["gpui/profiler", "dep:serde_json"]

[dev-dependencies]
gpui = { package = "gpui-kit", version = "=0.9.0", features = ["test-support"] }

# Keep the real rendering backend out of the proc-macro workspace and its MSRV.
[workspace]
