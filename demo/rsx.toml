# Semantic colors resolve through Kit's component theme at render time.
[options]
dynamic-runtime = "rsx_runtime"
preset = "gpui-component"

[colors]
demo-canvas = "#111a16"
demo-surface = "#19241f"
demo-raised = "#24352b"
demo-border = "#2b3b33"
demo-text = "#edf3ef"
demo-muted = "#bac8bf"
demo-accent = "#8bddc5"

[text-size]
body = "14px"

[line-height]
body = "20px"

[opacity]
muted = "60%"

[shadow]
card = { expr = "vec![BoxShadow::new(px(0.0), px(1.0), hsla(0.0, 0.0, 0.0, 0.2))]" }
