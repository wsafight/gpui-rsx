# =============================================================================
# Dependabot Configuration
# Dependabot 依赖自动更新配置
# =============================================================================
#
# English:
# Dependencies are updated manually. Version-update pull requests are disabled
# for each ecosystem with open-pull-requests-limit: 0.
#
# 中文：
# 依赖由维护者手动升级，各生态的版本更新 PR 均通过
# open-pull-requests-limit: 0 停用。
#
# Documentation / 文档:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# =============================================================================

version: 2
updates:
  # Maintain dependencies for Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    reviewers:
      - "wsafight"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group all patch updates into a single PR
    groups:
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    # Allow both direct and indirect dependencies
    versioning-strategy: auto

  # Maintain the locked GPUI and gpui-component compatibility graph.
  - package-ecosystem: "cargo"
    directory: "/demo"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    reviewers:
      - "wsafight"
    labels:
      - "dependencies"
      - "rust"
      - "gpui"
    commit-message:
      prefix: "chore(demo-deps)"
      include: "scope"
    versioning-strategy: auto

  # Maintain the Astro/Starlight documentation stack through Bun's lockfile.
  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    reviewers:
      - "wsafight"
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "chore(docs-deps)"
      include: "scope"
    groups:
      docs-updates:
        patterns:
          - "*"
    versioning-strategy: auto

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 0
    reviewers:
      - "wsafight"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
