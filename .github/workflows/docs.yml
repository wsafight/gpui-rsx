name: Docs

on:
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build Astro docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: playground-wasm
          path: docs/public/playground/pkg

      - name: Setup Bun
        uses: ./.github/actions/setup-ci-tool
        with:
          tool: bun
          version: 1.4.4

      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Check docs
        working-directory: docs
        run: bun run check

      - name: Build docs
        working-directory: docs
        run: bun run build:site

      - name: Install browser
        working-directory: docs
        run: bunx playwright install --with-deps chromium

      - name: Test docs in Chromium
        working-directory: docs
        run: bun run test:browser

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-browser-results
          path: |
            docs/test-results
            docs/playwright-report
          retention-days: 7

      - name: Upload Pages artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
