# =============================================================================
# Continuous Integration Workflow
# 持续集成工作流
# =============================================================================
#
# English:
# Runs on every push to main and on pull requests. Performs the following:
# - Test Suite: Runs tests on multiple platforms (Ubuntu, macOS, Windows)
#               and Rust versions (stable, beta)
# - Rustfmt: Checks code formatting
# - Clippy: Runs linter for code quality
# - Documentation: Builds and validates documentation
# - Security Audit: Checks for known vulnerabilities in dependencies
#
# 中文：
# 在每次推送到 main 分支和 PR 时运行。执行以下任务：
# - 测试套件：在多个平台（Ubuntu、macOS、Windows）和 Rust 版本
#           （stable、beta）上运行测试
# - Rustfmt：检查代码格式
# - Clippy：运行代码质量检查器
# - 文档：构建和验证文档
# - 安全审计：检查依赖中的已知漏洞
# =============================================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

# A newer commit supersedes older work on the same branch. This keeps the
# matrix from consuming runners after a fix has already been pushed.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.paths.outputs.core }}
      tooling: ${{ steps.paths.outputs.tooling }}
      demo: ${{ steps.paths.outputs.demo }}
      docs: ${{ steps.paths.outputs.docs }}
      editor: ${{ steps.paths.outputs.editor }}
      security: ${{ steps.paths.outputs.security }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: paths
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-changes.cjs

  automation:
    name: Compatibility Automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.cjs
      - run: node --test scripts/dev-reload*.test.mjs scripts/test-hot-reload.test.mjs scripts/test-readme.test.mjs
      - run: bash -n scripts/check.sh

      - name: Check documentation dependency examples
        run: |
          if rg -n 'gpui-rsx = "0\.7"' README.md README_CN.md docs/src/content/docs/getting-started.md docs/src/content/docs/zh-cn/getting-started.md docs/src/content/docs/compatibility.md docs/src/content/docs/zh-cn/compatibility.md docs/src/content/docs/guides/migration.md docs/src/content/docs/zh-cn/guides/migration.md; then
            echo 'Documentation contains an outdated gpui-rsx dependency example.' >&2
            exit 1
          fi

  msrv:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Root MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Check proc-macro crate
        run: cargo check --lib

  tooling-msrv:
    needs: changes
    if: needs.changes.outputs.tooling == 'true'
    name: Tooling MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Check CLI and shared tooling
        run: cargo check --locked -p gpui-rsx-tools -p cargo-rsx

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true'
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ github.job }}-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cargo test --workspace
          cargo test --workspace --all-features
          cargo test -p gpui-rsx-tools --no-default-features
          cargo clippy -p gpui-rsx-tools --all-targets --no-default-features -- -D warnings

  demo:
    needs: changes
    if: needs.changes.outputs.demo == 'true'
    name: Demo GPUI Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-demo-cargo-registry-${{ hashFiles('demo/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-demo-cargo-index-${{ hashFiles('demo/Cargo.lock') }}

      - name: Cache demo build
        uses: actions/cache@v4
        with:
          path: demo/target
          key: ${{ runner.os }}-demo-cargo-build-target-${{ hashFiles('demo/Cargo.lock') }}

      - name: Check demo bins
        run: cargo check --manifest-path demo/Cargo.toml --bins --locked

      - name: Link and test demo targets
        run: |
          cargo test --manifest-path demo/Cargo.toml --lib --bins --tests --locked
          cargo test --manifest-path demo/Cargo.toml --doc --locked

      - name: Check resolved demo backend
        run: cargo run --quiet -p cargo-rsx -- doctor --manifest-path demo/Cargo.toml

      - name: Check Kit hot-reload fixture
        run: |
          cargo test --manifest-path tests/fixtures/hot-reload/Cargo.toml --test change_detection --target-dir demo/target
          cargo check --manifest-path tests/fixtures/hot-reload/Cargo.toml --features hotreload,kit --bins --target-dir demo/target

      - name: Test renamed GPUI dependency
        run: cargo test --manifest-path tests/fixtures/gpui-renamed/Cargo.toml --target-dir demo/target

  gpui-022:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: GPUI 0.2.2 Feedback Regressions
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/fixtures/gpui-0.2.2
      - name: Test regressions against published GPUI 0.2.2
        run: cargo test --manifest-path tests/fixtures/gpui-0.2.2/Cargo.toml

  fmt:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true' || needs.changes.outputs.demo == 'true' || needs.changes.outputs.editor == 'true'
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ github.job }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true'
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ github.job }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  security_audit:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust lockfiles
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file demo/Cargo.lock
          cargo audit --file editors/zed/Cargo.lock
          cargo audit --file fuzz/Cargo.lock

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Audit documentation and VS Code dependencies
        run: |
          bun audit --cwd docs
          bun audit --cwd editors/vscode

  coverage:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true'
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ github.job }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  gpui-api:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.demo == 'true'
    name: Generated Outputs and GPUI API
    runs-on: ubuntu-latest
    env:
      GPUI_API_SNAPSHOT_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            demo
      - name: Verify the locked Kit and GPUI dependency graph
        run: cargo xtask check-gpui
      - name: Require all five API snapshots
        run: cargo test -p xtask --test gpui_api_snapshot
      - name: Require reproducible generated outputs
        run: |
          cargo xtask gen-tables --check
          cargo xtask spec --check
          cargo xtask compat-matrix --check
      - name: Keep hand-written Rust files under 600 non-test lines
        run: cargo xtask line-limit
      - name: Require one release version across manifests, lockfiles and docs
        run: cargo xtask bump --check

  benchmarks:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tooling == 'true'
    name: ${{ matrix.name }}
    strategy:
      matrix:
        include:
          - name: Expansion Performance
            crate: gpui-rsx-core
            bench: expansion
            threshold: '0.10'
          - name: Analysis Performance
            crate: gpui-rsx-tools
            bench: analysis
            threshold: '0.20'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CRITERION_HOME: ${{ github.workspace }}/target/criterion/${{ github.run_id }}-${{ github.run_attempt }}
      BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the base revision on this runner
        id: baseline
        shell: bash
        run: |
          if test -n "$BASE_REV" && git cat-file -e "$BASE_REV:crates/${{ matrix.crate }}/benches/${{ matrix.bench }}.rs" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/rsx-bench-base" "$BASE_REV"
            # Compare product code with the same harness, including span cleanup.
            cp crates/${{ matrix.crate }}/benches/${{ matrix.bench }}.rs "$RUNNER_TEMP/rsx-bench-base/crates/${{ matrix.crate }}/benches/${{ matrix.bench }}.rs"
            cargo bench --locked --manifest-path "$RUNNER_TEMP/rsx-bench-base/Cargo.toml" -p ${{ matrix.crate }} --bench ${{ matrix.bench }} -- --save-baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
            echo 'comparable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No matching benchmark in the base revision; recording the initial baseline.'
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compare benchmark costs
        if: steps.baseline.outputs.comparable == 'true'
        run: |
          cargo bench --locked -p ${{ matrix.crate }} --bench ${{ matrix.bench }} -- --baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
          if ! cargo xtask bench-check --threshold ${{ matrix.threshold }}; then
            echo 'Confirming the regression with a fresh baseline and candidate measurement.'
            cargo bench --locked --manifest-path "$RUNNER_TEMP/rsx-bench-base/Cargo.toml" -p ${{ matrix.crate }} --bench ${{ matrix.bench }} -- --save-baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
            cargo bench --locked -p ${{ matrix.crate }} --bench ${{ matrix.bench }} -- --baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
            cargo xtask bench-check --threshold ${{ matrix.threshold }}
          fi
      - name: Record initial baseline
        if: steps.baseline.outputs.comparable != 'true'
        run: cargo bench --locked -p ${{ matrix.crate }} --bench ${{ matrix.bench }} -- --save-baseline initial --sample-size 30 --warm-up-time 1 --measurement-time 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.bench }}-benchmarks
          path: ${{ env.CRITERION_HOME }}
          retention-days: 7

  tooling:
    needs: changes
    if: needs.changes.outputs.editor == 'true' || needs.changes.outputs.tooling == 'true'
    name: Playground and Editor Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Build VS Code extension
        run: |
          bun install --cwd editors/vscode --frozen-lockfile
          bun run --cwd editors/vscode check
          bun run --cwd editors/vscode test
          bun run --cwd editors/vscode package
      - name: Test VS Code with rust-analyzer
        run: |
          cargo build -p cargo-rsx --locked
          xvfb-run -a bun run --cwd editors/vscode test:integration
      - name: Test development reload prototype
        run: node --test scripts/dev-reload*.test.mjs
      - name: Build Zed extension
        run: cargo +1.98.1 build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: editor-extensions
          path: |
            editors/vscode/*.vsix
            editors/zed/target/wasm32-wasip1/release/*.wasm

  wasm:
    name: Playground WASM
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.tooling == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: scripts/build-playground.sh
      - run: node scripts/test-playground.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: playground-wasm
          path: docs/public/playground/pkg
          retention-days: 7

  site:
    name: Docs
    needs: [changes, wasm]
    if: needs.changes.outputs.docs == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      deploy: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  required:
    name: Required Checks
    if: always()
    needs: [changes, automation, msrv, tooling-msrv, test, demo, gpui-022, fmt, clippy, docs, security_audit, coverage, gpui-api, benchmarks, wasm, site, tooling]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.cjs
