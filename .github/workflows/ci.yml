# =============================================================================
# Continuous Integration Workflow
# 持续集成工作流
# =============================================================================
#
# English:
# Runs on every push to main and on pull requests. Performs the following:
# - Test Suite: Runs tests on multiple platforms (Ubuntu, macOS, Windows)
#               and Rust versions (stable, beta)
# - Rustfmt: Checks code formatting
# - Clippy: Runs linter for code quality
# - Documentation: Builds and validates documentation
# - Security Audit: Checks for known vulnerabilities in dependencies
#
# 中文：
# 在每次推送到 main 分支和 PR 时运行。执行以下任务：
# - 测试套件：在多个平台（Ubuntu、macOS、Windows）和 Rust 版本
#           （stable、beta）上运行测试
# - Rustfmt：检查代码格式
# - Clippy：运行代码质量检查器
# - 文档：构建和验证文档
# - 安全审计：检查依赖中的已知漏洞
# =============================================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  automation:
    name: Compatibility Automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.cjs
      - run: bash -n scripts/check.sh

  msrv:
    name: Root MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - name: Check proc-macro crate
        run: cargo check --lib

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: |
          cargo test --workspace
          cargo test --workspace --all-features

  demo:
    name: Demo GPUI Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-demo-cargo-registry-${{ hashFiles('demo/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-demo-cargo-index-${{ hashFiles('demo/Cargo.lock') }}

      - name: Cache demo build
        uses: actions/cache@v4
        with:
          path: demo/target
          key: ${{ runner.os }}-demo-cargo-build-target-${{ hashFiles('demo/Cargo.lock') }}

      - name: Check demo bins
        run: cargo check --manifest-path demo/Cargo.toml --bins --locked

      - name: Link and test demo bins
        run: cargo test --manifest-path demo/Cargo.toml --bins --locked

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  gpui-api:
    name: Generated Outputs and GPUI API
    runs-on: ubuntu-latest
    env:
      GPUI_API_SNAPSHOT_REQUIRED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            demo
      - name: Verify the locked Kit and GPUI dependency graph
        run: cargo xtask check-gpui
      - name: Require all five API snapshots
        run: cargo test -p xtask --test gpui_api_snapshot
      - name: Require reproducible generated outputs
        run: |
          cargo xtask gen-tables --check
          cargo xtask spec --check
          cargo xtask compat-matrix --check

  benchmarks:
    name: Expansion Performance
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the base revision on this runner
        id: baseline
        shell: bash
        run: |
          if test -n "$BASE_REV" && git cat-file -e "$BASE_REV:crates/gpui-rsx-core/benches/expansion.rs" 2>/dev/null; then
            git worktree add --detach "$RUNNER_TEMP/rsx-bench-base" "$BASE_REV"
            cargo bench --manifest-path "$RUNNER_TEMP/rsx-bench-base/Cargo.toml" -p gpui-rsx-core --bench expansion -- --save-baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
            echo 'comparable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No expansion benchmark in the base revision; recording the initial baseline.'
            echo 'comparable=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Compare expansion costs
        if: steps.baseline.outputs.comparable == 'true'
        run: |
          cargo bench -p gpui-rsx-core --bench expansion -- --baseline base --sample-size 30 --warm-up-time 1 --measurement-time 2
          cargo xtask bench-check --threshold 0.10
      - name: Record initial baseline
        if: steps.baseline.outputs.comparable != 'true'
        run: cargo bench -p gpui-rsx-core --bench expansion -- --save-baseline initial --sample-size 30 --warm-up-time 1 --measurement-time 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expansion-benchmarks
          path: target/criterion
          retention-days: 7

  tooling:
    name: Playground and Editor Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown,wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build the WASM playground
        run: scripts/build-playground.sh
      - name: Test browser WASM and worker protocol
        run: node scripts/test-playground.mjs
      - name: Build VS Code extension
        run: |
          bun install --cwd editors/vscode --frozen-lockfile
          bun run --cwd editors/vscode check
          bun run --cwd editors/vscode package
      - name: Build Zed extension
        run: cargo +1.98.1 build --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: editor-extensions
          path: |
            editors/vscode/*.vsix
            editors/zed/target/wasm32-wasip1/release/*.wasm
