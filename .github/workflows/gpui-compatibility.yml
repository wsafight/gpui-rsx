name: GPUI Compatibility

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  DEMO_MANIFEST: demo/Cargo.toml

jobs:
  compatibility:
    name: Latest GPUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Cache Cargo data
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            demo/target
          key: ${{ runner.os }}-latest-gpui-${{ hashFiles('Cargo.lock', 'demo/Cargo.lock') }}

      - name: Record locked sources
        id: locked
        run: |
          cargo metadata --manifest-path "$DEMO_MANIFEST" --locked --format-version 1 > locked-metadata.json
          echo "gpui=$(jq -r '[.packages[] | select(.name == "gpui") | .source] | unique | join(",")' locked-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "component=$(jq -r '[.packages[] | select(.name == "gpui-component") | .source] | unique | join(",")' locked-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Update both upstream repositories
        run: |
          cargo update --manifest-path "$DEMO_MANIFEST" -p gpui-component
          cargo update --manifest-path "$DEMO_MANIFEST" -p gpui -p gpui_platform
          cargo metadata --manifest-path "$DEMO_MANIFEST" --format-version 1 > latest-metadata.json

      - name: Record latest sources
        id: latest
        run: |
          echo "gpui=$(jq -r '[.packages[] | select(.name == "gpui") | .source] | unique | join(",")' latest-metadata.json)" >> "$GITHUB_OUTPUT"
          echo "component=$(jq -r '[.packages[] | select(.name == "gpui-component") | .source] | unique | join(",")' latest-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Require one GPUI package ID
        id: unique-gpui
        continue-on-error: true
        run: |
          count=$(jq '[.packages[] | select(.name == "gpui") | .id] | unique | length' latest-metadata.json)
          cargo tree --manifest-path "$DEMO_MANIFEST" -i gpui
          cargo tree --manifest-path "$DEMO_MANIFEST" -d
          test "$count" -eq 1

      - name: Check StatefulInteractiveElement API snapshot
        id: api-snapshot
        continue-on-error: true
        run: |
          manifest=$(jq -r '.packages[] | select(.name == "gpui") | .manifest_path' latest-metadata.json)
          GPUI_SOURCE_ROOT=$(dirname "$manifest") cargo test --test gpui_api_snapshot

      - name: Check all real API contracts
        id: build
        continue-on-error: true
        run: cargo check --manifest-path "$DEMO_MANIFEST" --bins

      - name: Clippy all real API contracts
        id: clippy
        continue-on-error: true
        run: cargo clippy --manifest-path "$DEMO_MANIFEST" --bins -- -D warnings

      - name: Run root tests
        id: test
        continue-on-error: true
        run: cargo test --all-features

      - name: Write platform result
        if: always()
        run: |
          mkdir -p compatibility-result
          jq -n \
            --arg os "${{ matrix.os }}" \
            --arg locked_gpui "${{ steps.locked.outputs.gpui }}" \
            --arg locked_component "${{ steps.locked.outputs.component }}" \
            --arg latest_gpui "${{ steps.latest.outputs.gpui }}" \
            --arg latest_component "${{ steps.latest.outputs.component }}" \
            --arg unique_gpui "${{ steps.unique-gpui.outcome }}" \
            --arg api_snapshot "${{ steps.api-snapshot.outcome }}" \
            --arg build "${{ steps.build.outcome }}" \
            --arg clippy "${{ steps.clippy.outcome }}" \
            --arg test "${{ steps.test.outcome }}" \
            '{os: $os, locked_gpui: $locked_gpui, locked_component: $locked_component, latest_gpui: $latest_gpui, latest_component: $latest_component, unique_gpui: $unique_gpui, api_snapshot: $api_snapshot, build: $build, clippy: $clippy, test: $test}' \
            > "compatibility-result/${{ runner.os }}.json"

      - name: Upload platform result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ runner.os }}
          path: compatibility-result/*.json

      - name: Fail incompatible platform
        if: always()
        run: |
          test "${{ steps.unique-gpui.outcome }}" = success
          test "${{ steps.api-snapshot.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.clippy.outcome }}" = success
          test "${{ steps.test.outcome }}" = success

  report:
    name: Report Compatibility
    if: always()
    needs: compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Download platform results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: compatibility-*
          path: compatibility-results
          merge-multiple: true

      - name: Create, update, or close compatibility issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultDir = 'compatibility-results';
            const files = fs.existsSync(resultDir)
              ? fs.readdirSync(resultDir).filter(file => file.endsWith('.json'))
              : [];
            const results = files.map(file =>
              JSON.parse(fs.readFileSync(path.join(resultDir, file), 'utf8'))
            );
            const checks = ['unique_gpui', 'api_snapshot', 'build', 'clippy', 'test'];
            const failed = results.length !== 2 || results.some(result =>
              checks.some(check => result[check] !== 'success')
            );
            const first = results[0] || {};
            const shortHash = source => {
              const match = (source || '').match(/#([0-9a-f]{7,40})$/);
              return match ? match[1].slice(0, 8) : 'unknown';
            };
            const gpuiHash = shortHash(first.latest_gpui);
            const componentHash = shortHash(first.latest_component);
            const title = `GPUI compatibility: gpui@${gpuiHash} / component@${componentHash}`;
            const body = [
              '## Latest GPUI compatibility check failed',
              '',
              `Locked GPUI source: \`${first.locked_gpui || 'unavailable'}\``,
              `Latest GPUI source: \`${first.latest_gpui || 'unavailable'}\``,
              `Locked gpui-component source: \`${first.locked_component || 'unavailable'}\``,
              `Latest gpui-component source: \`${first.latest_component || 'unavailable'}\``,
              '',
              '| Platform | Single GPUI | API snapshot | Build | Clippy | Tests |',
              '| --- | --- | --- | --- | --- | --- |',
              ...results.map(result =>
                `| ${result.os} | ${result.unique_gpui} | ${result.api_snapshot} | ${result.build} | ${result.clippy} | ${result.test} |`
              ),
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'gpui-compatibility',
            });

            if (failed) {
              const existing = issues.find(issue => issue.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['gpui-compatibility', 'bug'],
                });
              }
              core.setFailed('Latest GPUI compatibility check failed');
              return;
            }

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Compatibility restored with gpui@${gpuiHash} and component@${componentHash}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }
