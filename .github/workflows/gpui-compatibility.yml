name: GPUI Compatibility

on:
  # Upstream upgrades are maintained manually; do not create scheduled PRs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-compatibility
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  GPUI_API_SNAPSHOT_REQUIRED: 1

jobs:
  prepare:
    name: Regenerate Against Upstream
    runs-on: ubuntu-latest
    outputs:
      gpui: ${{ steps.revisions.outputs.gpui }}
      component: ${{ steps.revisions.outputs.component }}
      kit: ${{ steps.revisions.outputs.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update to the latest published Kit and its matching snapshot
        run: node .github/scripts/update-gpui.cjs
      - name: Record versions and require one matching GPUI
        id: revisions
        run: |
          cargo xtask check-gpui > verified-versions.json
          echo "gpui=$(jq -r '.gpui' verified-versions.json)" >> "$GITHUB_OUTPUT"
          echo "component=$(jq -r '.component' verified-versions.json)" >> "$GITHUB_OUTPUT"
          echo "kit=$(jq -r '.kit' verified-versions.json)" >> "$GITHUB_OUTPUT"
      - name: Regenerate mappings, contracts, specification and compatibility matrix
        run: |
          cargo xtask gen-tables
          cargo xtask spec
          cargo xtask compat-matrix
          cargo fmt --all -- --check
      - name: Save the exact update for both platforms
        run: |
          mkdir -p compatibility-update
          git diff --binary > compatibility-update/upstream.patch
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-update
          path: compatibility-update/upstream.patch
          if-no-files-found: error

  validate:
    name: Verify Update (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: actions/download-artifact@v4
        with:
          name: compatibility-update
          path: compatibility-update
      - name: Apply the generated update
        run: |
          if test -s compatibility-update/upstream.patch; then
            git apply compatibility-update/upstream.patch
          fi
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            demo
      - name: Require the prepared Kit and GPUI dependency graph
        run: cargo xtask check-gpui
      - name: Check all generated outputs
        run: |
          cargo xtask gen-tables --check
          cargo xtask spec --check
          cargo xtask compat-matrix --check
      - name: Check all five GPUI API snapshots
        run: cargo test -p xtask --test gpui_api_snapshot --locked
      - name: Test both spacing configurations
        run: |
          cargo test --workspace --locked
          cargo test --workspace --all-features --locked
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check, lint and test all real GPUI contracts
        run: |
          cargo check --manifest-path demo/Cargo.toml --bins --locked
          cargo clippy --manifest-path demo/Cargo.toml --bins --locked -- -D warnings
          cargo test --manifest-path demo/Cargo.toml --bins --locked

  report:
    name: Publish Repair or Update Tracker
    if: always()
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.validate.result == 'success'
        with:
          name: compatibility-update
          path: compatibility-update
      - name: Apply verified update
        if: needs.validate.result == 'success'
        run: |
          if test -s compatibility-update/upstream.patch; then
            git apply compatibility-update/upstream.patch
          fi
      - name: Create or update repair PR
        id: repair
        if: needs.validate.result == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/gpui-compatibility
          commit-message: 'chore: regenerate GPUI compatibility contracts'
          title: 'fix: compatibility with ${{ needs.prepare.outputs.kit }}'
          body: |
            Updates the exact Kit pin and demo lockfile, then regenerates mappings, five API snapshots,
            GPUI stubs, real API contracts, syntax specification and compatibility matrices.

            Verified GPUI Kit: `${{ needs.prepare.outputs.kit }}`
            Verified GPUI snapshot: `${{ needs.prepare.outputs.gpui }}`
            Verified component release: `${{ needs.prepare.outputs.component }}`

            Validation: generated output checks, default/all-feature workspace tests,
            Clippy and real GPUI demo checks on Linux and macOS.
          add-paths: |
            demo/Cargo.toml
            demo/Cargo.lock
            demo/src/bin/generated_api_contract.rs
            crates/gpui-rsx-core/src/codegen/tables_generated.rs
            crates/gpui-stub/src/generated.rs
            tests/common/generated_styled.rs
            benches/support/generated_styled.rs
            tests/fixtures/gpui_api
            spec
            README.md
            README_CN.md
            docs/src/content/docs/compatibility.md
            docs/src/content/docs/zh-cn/compatibility.md
      - name: Maintain a single compatibility tracker
        if: always()
        uses: actions/github-script@v7
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          REPAIR_RESULT: ${{ steps.repair.outcome }}
          REPAIR_URL: ${{ steps.repair.outputs.pull-request-url }}
          KIT_VERSION: ${{ needs.prepare.outputs.kit }}
          GPUI_VERSION: ${{ needs.prepare.outputs.gpui }}
          COMPONENT_VERSION: ${{ needs.prepare.outputs.component }}
        with:
          script: |
            await require("./.github/scripts/compatibility-report.cjs")({ github, context, core });
